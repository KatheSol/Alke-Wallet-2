{% extends 'gestion/index/menu_index.html' %}

{% load static %} 

{% block title %} Login | {% endblock %}

{% block menu_index %}
        
    <main>
        <div class="main-login">
            <div class="form mb-5 div-login">
                <h2>Login</h2>
                <form id="formLogin" method="POST" >
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="mb-3">
                            <label for="{{field.id_for_label}}" class="form label">{{field.label}}</label>
                            {{field}}
                        </div>
                    {% endfor %}
                    <div>
                        <button type="submit" class="btn btn-primary mt-3" >Iniciar Sesión</button>
                        <a class="registrate" href="{% url 'registro-user' %}">Registrate aquí</a>
                    </div>
                </form>
            </div>
        </div>
    </main>

{% endblock menu_index %}
